spring.application.name=dota2

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:data/dota2.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA/Hibernate for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration (SQLite specific)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=20000

# Disable H2 Console (we're using SQLite now)
spring.h2.console.enabled=false

# Logging
logging.level.com.dotadrafter.dota2=DEBUG
logging.level.org.springframework.web=DEBUG
